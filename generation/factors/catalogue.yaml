# Factor catalogue: the conditions every generated sample is built from.
# See docs/factor-catalogue.md for the rationale and review notes.
#
# The plan builder picks one value per spec factor, applies constraints.yaml,
# and derives the label from the listener's intent. Each resulting combination is a
# criterion (a row in the targets table) with a required sample count. Gemini only writes text that
# satisfies the chosen values.

version: 0.11.0
status: draft  # awaiting user review

files:
  languages: languages.yaml
  domains: domains.yaml
  intents: intents.yaml
  constraints: constraints.yaml

# Factors the plan builder chooses for every spec, in a fixed order.
spec_factors:
  - id: language
    description: Language of the conversation. Values come from languages.yaml.
    values_from: languages

  - id: regional_variant
    description: >
      Regional variety of the language (e.g. en-IN, es-MX). Values come from the
      language's regional_variants list; the language code itself when the list
      is empty.
    values_from: languages.regional_variants

  - id: script_form
    description: How the people's words are written in the transcript.
    values:
      - id: native
        description: The language's usual script (Devanagari for Hindi, Latin for English).
      - id: romanized
        description: Written in Latin/English characters, e.g. "haan theek hai".
      - id: mixed_script
        description: >
          Native script and romanized text in the same utterance, e.g.
          "haan हाँ ठीक है".

  - id: code_switching
    description: Whether and how the people mix in another language.
    values:
      - id: none
        description: Only the conversation language.
      - id: mixed
        description: >
          The other language(s) mixed in, as people of the region mix them, e.g.
          "சரி சரி, but change the time". How they are mixed (within or between
          sentences) is not a factor (user decision, 2026-11-15).

  - id: code_switch_set
    description: >
      The language(s) mixed in when code_switching is not none, written as
      codes joined by "+" in the manifest's order, e.g. "en" or "en+hi".
      Values come from the language's code_switch_sets, filtered by
      regional_variant; "none" when code_switching is none. With two
      languages, both must appear in the candidate utterance or its turn
      (e.g. Kannada + English + Hindi).
    values_from: languages.code_switch_sets

  - id: mixed_in_script
    description: >
      How the mixed-in language is written, for code-switch sets that allow a
      choice (mixed_in_scripts in languages.yaml), e.g. Mandarin in Malaysian
      English as Chinese characters or as pinyin. `default` everywhere else;
      a factor at `default` is left out of the combination_id.
    values:
      - id: default
        description: The manifest's default for the set.
      - id: native
        description: In the mixed-in language's own script, e.g. Chinese characters.
      - id: romanized
        description: Romanized, e.g. pinyin or Jyutping.

  - id: domain
    description: Conversation category. Values come from domains.yaml.
    values_from: domains

  - id: scenario
    description: A concrete situation within the domain. Values come from domains.yaml.
    values_from: domains.scenarios

  - id: speaker_pattern
    description: >
      Who speaks in the 3-line window. The last line is always the speaker being
      judged and the line before it is the turn being spoken over, so consecutive
      lines always have different speakers. 2-line windows are always s1, s2.
    values:
      - id: returning_speaker
        description: >
          The listener (the person judged) also said the first line, before
          the speaker's turn (s1, s2, s1).
      - id: new_speaker
        description: >
          A third person said the first line; the listener, who is judged, has
          not spoken yet in the window (s1, s2, s3).

  - id: agent_activity
    description: >
      What the speaker (the person with the floor) is doing in the turn the
      listener speaks over or right after.
    values:
      - id: greeting_opening
        description: Opening the conversation, greeting or introducing themselves or the purpose.
      - id: explaining
        description: Explaining a policy, process, status or reason.
      - id: giving_instructions
        description: Step-by-step instructions the listener is following.
      - id: listing_options
        description: Listing choices, plans, slots or products.
      - id: reading_numbers
        description: Reading out amounts, dates, times, account, order or phone numbers.
      - id: reading_names_addresses
        description: Reading out names, addresses, emails or spellings.
      - id: confirming_details
        description: Reading back details for the listener to confirm.
      - id: asking_yes_no_question
        description: Asking a closed question.
      - id: asking_open_question
        description: Asking an open question (which, when, what, why).
      - id: disclosure
        description: Legal, recording or terms-and-conditions text.
      - id: empathizing
        description: Apologizing or acknowledging the listener's problem.
      - id: hold_message
        description: Telling the listener they are checking something, or asking them to wait.
      - id: pitching
        description: Promoting an offer, upgrade or product.
      - id: small_talk
        description: Pleasantries, weather, how the listener is.
      - id: closing
        description: >
          Wrapping up the conversation: summarising, asking whether anything
          else is needed, saying goodbye.

  - id: cut_position
    description: How much of the speaker's turn had been spoken when the listener started.
    values:
      - id: start
        description: Within the first few words.
      - id: early
        description: Roughly the first third.
      - id: middle
        description: Roughly the middle third.
      - id: near_end
        description: The last few words still to come.
      - id: just_finished
        description: The speaker had just finished their turn (short grace window).

  - id: caller_intent
    description: >
      What the listener means by the last line. Values come from
      intents.yaml, and each intent determines the label.
    values_from: intents

  - id: register
    description: Formality of the people's speech.
    values:
      - id: formal
      - id: casual

  - id: caller_mood
    description: The listener's emotional state, which shapes wording.
    values:
      - id: neutral
      - id: friendly
      - id: hurried
      - id: confused
      - id: frustrated

# Values computed from spec factors, not chosen independently.
derived_factors:
  - id: agent_state
    description: >
      Model input: whether the speaker was still speaking or had just
      finished; derived from cut_position.
    rule:
      just_finished: just_finished
      default: speaking

  - id: intended_label
    description: >
      The label the criterion asks for; derived from caller_intent via
      intents.yaml. The training label is Gemini's classification of the
      generated sample, accepted only when it agrees (see docs/data-format.md).
    values: [backchannel, barge_in, ambiguous]

# Assigned by the plan builder, not part of the factor space.
plan_assigned:
  - required_count
  - quota_group
  - priority
  - split

# Deliberately NOT spec factors; they vary later in the pipeline, so one
# generated conversation serves all of them (see docs/data-format.md).
not_spec_factors:
  turn_shape: Stage 4 builds both 2-turn and 3-turn examples from every conversation.
  prefix: Stage 4 expands every interim prefix of the candidate utterance.

# People: every conversation has a speaker (who has the floor) and a listener
# (who says the last line); a third person may say the first line. They can be
# any people in the domain's situation, named by role or by name. In
# deployment the speaker is usually a voice agent, but the data never assumes
# it. Factor and column names that say "agent" mean the speaker.
#
# Out of scope: inputs are cleaned-up transcripts of the listener speaking to the
# speaker. ASR noise, echo, background speech and media audio are handled
# upstream, so nothing here simulates them. Generated text is clean.
