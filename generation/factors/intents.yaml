# Caller intents. Each intent fixes the label of the final utterance.
#
# Scope: every candidate utterance is the caller speaking to the agent. Echo,
# background speech, media audio and transcription glitches are handled by
# noise cancellation and audio cleaning upstream, not by this model.
#
# Labels:
#   backchannel        Caller does not want the floor; the agent keeps talking.
#   barge_in           Caller takes the floor. With agent_state=just_finished
#                      this means "a real caller turn", not an interruption.
#   ambiguous          Reasonable listeners disagree. Evaluation only; never
#                      used for training.
#
# examples are hints for prompts and reviewers, not word lists. The generator
# must produce natural, varied wording. Kannada and Tamil hints are unverified.
#
# length_buckets: allowed final-utterance lengths for the intent.
# repeatable: whether repetition=repeated is allowed.

version: 0.5.0

intents:
  # ---------------- backchannel ----------------
  - id: continuer
    label: backchannel
    description: Signals "go on, I'm listening" without words of content.
    length_buckets: [w1, w2_3]
    repeatable: true
    examples:
      en: ["hmm", "mm-hmm", "uh-huh"]
      hi: ["hmm", "haan", "हम्म"]

  - id: acknowledgment
    label: backchannel
    description: >
      Signals the information was received or understood. A bare "ok" (or
      "achha", "theek hai", "sari", "I see") is always this, even right after
      the agent finishes a statement. After a finished question it is
      answer_to_question instead.
    length_buckets: [w1, w2_3, w4_8]
    repeatable: true
    examples:
      en: ["ok", "right", "got it", "I see", "makes sense", "okay okay"]
      hi: ["achha", "theek hai", "ठीक है", "ok ji", "samajh gaya"]
      kn: ["sari", "ಸರಿ"]
      ta: ["sari", "சரி"]

  - id: agreement_token
    label: backchannel
    description: Agreement or affirmation that does not answer a question.
    length_buckets: [w1, w2_3, w4_8]
    repeatable: true
    examples:
      en: ["yes", "yeah yeah", "exactly", "true"]
      hi: ["haan haan", "ji", "bilkul", "हाँ जी"]
      kn: ["haudu", "houdu", "oudhu", "ಹೌದು"]
      ta: ["aamaa", "ஆமா"]
      fr: ["oui oui", "d'accord"]

  - id: reaction_token
    label: backchannel
    description: >
      A short emotional reaction that does not ask for a response: surprise,
      sympathy, pleasure or laughter as transcribed.
    length_buckets: [w1, w2_3, w4_8]
    repeatable: true
    examples:
      en: ["oh", "wow", "oh no", "aww", "that's good", "haha"]
      hi: ["arre", "sach mein", "arre yaar", "oh ho", "badhiya"]

  - id: gratitude_token
    label: backchannel
    description: Thanks said in passing while the agent continues.
    length_buckets: [w1, w2_3]
    repeatable: true
    examples:
      en: ["thanks", "thank you"]
      hi: ["shukriya", "dhanyavaad", "thank you ji"]

  - id: tracking_repeat
    label: backchannel
    description: >
      Caller repeats part of what the agent is reading (digits, a name) to
      track or write it down, without correcting it.
    length_buckets: [w1, w2_3, w4_8]
    repeatable: false
    examples:
      en: ["four five six", "M G road"]

  - id: go_ahead
    label: backchannel
    description: Invites the agent to carry on.
    length_buckets: [w1, w2_3]
    repeatable: true
    examples:
      en: ["go on", "continue", "go ahead"]
      hi: ["haan bolo", "boliye", "aage bataiye"]

  # ---------------- barge_in ----------------
  - id: floor_request
    label: barge_in
    description: Asks the agent to stop, wait or give the caller a moment.
    length_buckets: [w1, w2_3, w4_8, w9_plus]
    repeatable: true
    examples:
      en: ["stop", "wait", "hold on", "wait wait", "one second let me get a pen"]
      hi: ["ruko", "ek minute", "रुकिए", "ek second, pen leta hoon"]

  - id: correction
    label: barge_in
    description: Corrects something the agent said or read.
    length_buckets: [w1, w2_3, w4_8, w9_plus]
    repeatable: true
    examples:
      en: ["no it's four not five", "no no, the other address"]
      hi: ["nahi nahi, paanch nahi chaar"]

  - id: disagreement
    label: barge_in
    description: Objects to or rejects what the agent is saying.
    length_buckets: [w1, w2_3, w4_8, w9_plus]
    repeatable: false
    examples:
      en: ["no", "that's not what I was told", "I don't want that"]
      hi: ["nahi", "aisa nahi hai"]

  - id: clarification_question
    label: barge_in
    description: Asks what the agent means or which item it refers to.
    length_buckets: [w1, w2_3, w4_8, w9_plus]
    repeatable: false
    examples:
      en: ["which?", "sorry which one", "what do you mean by that"]
      hi: ["matlab?", "kaunsa wala?"]

  - id: repeat_request
    label: barge_in
    description: >
      Asks the agent to repeat, slow down or speak up, or says they could not
      hear.
    length_buckets: [w1, w2_3, w4_8]
    repeatable: true
    examples:
      en: ["sorry?", "what", "can you repeat that", "slower please", "louder"]
      hi: ["kya?", "phir se boliye", "dheere boliye"]

  - id: new_request
    label: barge_in
    description: Raises a new request or changes the topic.
    length_buckets: [w4_8, w9_plus]
    repeatable: false
    examples:
      en: ["actually I also need to update my email"]

  - id: early_answer
    label: barge_in
    description: >
      Answers or chooses before the agent has finished asking or listing,
      making the rest of the turn unnecessary. It must carry content: name or
      point to an option ("the second one", "Tuesday"), or add content to a
      yes/no ("yes book it"). Never a bare "yes" or "ok" on its own.
    length_buckets: [w1, w2_3, w4_8]
    repeatable: false
    examples:
      en: ["the second one", "Tuesday works", "yes book it"]
      hi: ["doosra wala", "mangalvaar theek hai", "haan book kar do"]

  - id: answer_to_question
    label: barge_in
    description: >
      Answers a question the agent has just finished asking. May be a single
      word that would otherwise look like a backchannel ("yes", "ok", "haan").
    length_buckets: [w1, w2_3, w4_8, w9_plus]
    repeatable: true
    examples:
      en: ["yes", "tomorrow", "no thanks"]
      hi: ["haan", "kal", "nahi chahiye"]

  - id: complaint
    label: barge_in
    description: >
      Expresses frustration or urgency that demands a response, including
      something time-sensitive the caller must say now.
    length_buckets: [w4_8, w9_plus]
    repeatable: false
    examples:
      en: ["I've been waiting for an hour", "my card was just charged again"]
      hi: ["main ek ghante se wait kar raha hoon"]

  - id: request_human
    label: barge_in
    description: Asks for a human agent or a supervisor.
    length_buckets: [w1, w2_3, w4_8, w9_plus]
    repeatable: false
    examples:
      en: ["agent", "human please", "can I talk to a person"]
      hi: ["kisi insaan se baat karao"]

  - id: end_call
    label: barge_in
    description: Ends the call, or asks to be called back later.
    length_buckets: [w1, w2_3, w4_8, w9_plus]
    repeatable: true
    examples:
      en: ["ok bye", "I have to go", "call me later", "not now I'm driving"]
      hi: ["baad mein call karo", "abhi nahi, bye"]

  - id: turn_continuation
    label: barge_in
    description: >
      The caller picks their own earlier point back up, adding to or
      continuing what they said in their previous turn.
    length_buckets: [w2_3, w4_8, w9_plus]
    repeatable: false
    examples:
      en: ["and also the other order", "and one more thing about that"]
      hi: ["aur doosra order bhi"]

  - id: skip_request
    label: barge_in
    description: Asks the agent to skip ahead or get to the point.
    length_buckets: [w1, w2_3, w4_8, w9_plus]
    repeatable: false
    examples:
      en: ["skip", "skip that", "just tell me the amount", "I know, go to the next part"]
      hi: ["chhodo yeh", "seedha amount batao"]

  - id: hello_check
    label: barge_in
    description: Checks whether the agent or the line is still there.
    length_buckets: [w1, w2_3, w4_8]
    repeatable: true
    examples:
      en: ["hello?", "are you there", "hello hello"]
      hi: ["hello?", "aap sun rahe ho?"]

  - id: language_switch_request
    label: barge_in
    description: Asks the agent to speak another language.
    length_buckets: [w2_3, w4_8, w9_plus]
    repeatable: false
    examples:
      en: ["can you speak hindi", "english please"]
      hi: ["hindi mein bolo", "english mein baat kariye"]

  # ---------------- ambiguous (evaluation only) ----------------
  # Generator/judge disagreements also feed the ambiguous evaluation pool;
  # 0.4.0's mixed_signal intent was removed in favour of them.
  - id: collaborative_completion
    label: ambiguous
    description: The caller finishes the agent's sentence for it.
    length_buckets: [w1, w2_3, w4_8]
    repeatable: false

  - id: thinking_filler_after_question
    label: ambiguous
    description: "\"hmm\" or \"umm\" right after the agent asks a question: thinking, not yet answering."
    length_buckets: [w1, w2_3]
    repeatable: true
