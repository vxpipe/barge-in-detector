       {languages: [kn], regional_variants: [en-IN]},
       {languages: [ta], regional_variants: [en-IN]},
       {languages: [te], regional_variants: [en-IN]},
       {languages: [ml], regional_variants: [en-IN]},
       {languages: [mr], regional_variants: [en-IN]},
       {languages: [gu], regional_variants: [en-IN]},
       {languages: [pa], regional_variants: [en-IN]},
       {languages: [bn], regional_variants: [en-IN]},
       {languages: [as], regional_variants: [en-IN]},
