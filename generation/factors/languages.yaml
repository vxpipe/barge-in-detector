# Language manifest: every language the detector supports.
#
# scripts: ISO 15924 codes of the usual native script(s).
# romanized_usage: how often people (or ASR) write the language in Latin
#   characters. common/occasional allow romanized and mixed_script specs;
#   none allows native only. Languages written natively in Latin script use none.
# Indian languages and Mandarin are written in their native script only
#   (romanized_usage: none; user decisions, 2026-11-15). Words of an Indian
#   language mixed into Indian English are in that language's native script
#   (mixed_in_scripts: [native]).
# script_name: how prompts name the native script when the plain script name
#   misleads (Urdu is written in its Perso-Arabic alphabet, not plain Arabic).
# never_scripts: scripts the language must never be written in although
#   Gemini tends to (Urdu in India is still never Devanagari).
# code_switch_sets: the combinations of languages commonly mixed in, most
#   common first. A set may hold more than one language (e.g. [en, hi] for a
#   Kannada speaker mixing English and Hindi) and may be limited to some
#   regional_variants (Hindi mixing applies to Indian varieties only).
#   Indian pattern (user decision, 2026-11-15): an Indian language alone or
#   mixed with English; Indian English mixed with one Indian language. No
#   three-language sets. English has romanized_usage
#   none, so Hindi or regional words in English-led speech are romanized.
# mixed_in_scripts (optional, per set): the ways the mixed-in language may be
#   written, chosen per spec by the mixed_in_script factor: native (its own
#   script, e.g. Chinese characters) and/or romanized (e.g. pinyin). Without
#   it the default applies: words mixed into Latin-script or romanized speech
#   are romanized (Hinglish style), and words mixed into native-script speech
#   are written in that script. English mixing Mandarin (Malaysia, Singapore)
#   or Cantonese (Hong Kong) is generated both ways.
# variant_scripts (optional): the native script of a variant when it is not
#   the first in `scripts` (zh-TW writes Traditional characters).
# romanization (optional): the usual romanization's name (pinyin, Jyutping),
#   used in prompts.
# region (optional): ISO 3166 region for a language without regional_variants,
#   used to build locales (hi -> hi-IN; English mixed into it -> en-IN).
# regional_variants: BCP-47 variants to spread generation across; empty means
#   the language code itself.
# tier: A = human-verified by the project owner; B = native-speaker spot
#   checks; C = synthetic only, reported as unverified.
# rollout_phase: 1 = English and Hindi, 2 = Kannada and Tamil, 3 = the rest.
#
# romanized_usage, code_switch_sets and regional_variants for tier C
# languages are first estimates and should be corrected when evidence appears.

version: 0.9.0

languages:
  - {code: en, name: English, scripts: [Latn], romanized_usage: none, regional_variants: [en-US, en-IN, en-SG], tier: A, rollout_phase: 1,
     code_switch_sets: [
       {languages: [hi], regional_variants: [en-IN], mixed_in_scripts: [native]},
       {languages: [kn], regional_variants: [en-IN], mixed_in_scripts: [native]},
       {languages: [ta], regional_variants: [en-IN], mixed_in_scripts: [native]},
       {languages: [te], regional_variants: [en-IN], mixed_in_scripts: [native]},
       {languages: [ml], regional_variants: [en-IN], mixed_in_scripts: [native]},
       {languages: [zh], regional_variants: [en-SG], mixed_in_scripts: [native]}
     ]}
  - {code: hi, name: Hindi, scripts: [Deva], romanized_usage: none, regional_variants: [], region: IN, tier: A, rollout_phase: 1, code_switch_sets: [{languages: [en]}]}
  - {code: kn, name: Kannada, scripts: [Knda], romanized_usage: none, regional_variants: [], region: IN, tier: A, rollout_phase: 2, code_switch_sets: [{languages: [en]}]}
  - {code: ta, name: Tamil, scripts: [Taml], romanized_usage: none, regional_variants: [ta-IN], tier: A, rollout_phase: 2, code_switch_sets: [{languages: [en]}]}
  - {code: te, name: Telugu, scripts: [Telu], romanized_usage: none, regional_variants: [], region: IN, tier: C, rollout_phase: 3, code_switch_sets: [{languages: [en]}]}
  - {code: ml, name: Malayalam, scripts: [Mlym], romanized_usage: none, regional_variants: [], region: IN, tier: C, rollout_phase: 3, code_switch_sets: [{languages: [en]}]}
  - {code: ur, name: Urdu, scripts: [Arab], script_name: "Urdu (Perso-Arabic)", never_scripts: [Deva], romanized_usage: none, regional_variants: [ur-IN], tier: C, rollout_phase: 3, code_switch_sets: [{languages: [en]}]}
  - {code: zh, name: "Mandarin Chinese", scripts: [Hans], romanized_usage: none, regional_variants: [zh-CN], tier: C, rollout_phase: 3, code_switch_sets: [{languages: [en]}]}
  - {code: ja, name: Japanese, scripts: [Jpan], romanized_usage: none, regional_variants: [], tier: C, rollout_phase: 3, code_switch_sets: [{languages: [en]}]}
  - {code: id, name: Indonesian, scripts: [Latn], romanized_usage: none, regional_variants: [], tier: C, rollout_phase: 3, code_switch_sets: [{languages: [en]}]}
  - {code: fil, name: Filipino, scripts: [Latn], romanized_usage: none, regional_variants: [], tier: C, rollout_phase: 3, code_switch_sets: [{languages: [en]}]}
  - {code: es, name: Spanish, scripts: [Latn], romanized_usage: none, regional_variants: [es-ES, es-MX], tier: C, rollout_phase: 3, code_switch_sets: [{languages: [en]}]}
  - {code: fr, name: French, scripts: [Latn], romanized_usage: none, regional_variants: [fr-FR], tier: C, rollout_phase: 3, code_switch_sets: [{languages: [en]}]}
  - {code: de, name: German, scripts: [Latn], romanized_usage: none, regional_variants: [de-DE], tier: C, rollout_phase: 3, code_switch_sets: [{languages: [en]}]}
  - {code: it, name: Italian, scripts: [Latn], romanized_usage: none, regional_variants: [], tier: C, rollout_phase: 3, code_switch_sets: [{languages: [en]}]}
