       {languages: [hi, ta], regional_variants: [en-IN]},
       {languages: [hi, te], regional_variants: [en-IN]},
       {languages: [hi, ml], regional_variants: [en-IN]},
       {languages: [hi, mr], regional_variants: [en-IN]},
       {languages: [hi, gu], regional_variants: [en-IN]},
