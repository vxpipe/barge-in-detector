# Language manifest: every language the detector supports.
#
# scripts: ISO 15924 codes of the usual native script(s).
# romanized_usage: how often people (or ASR) write the language in Latin
#   characters. common/occasional allow romanized and mixed_script specs;
#   none allows native only. Languages written natively in Latin script use none.
# code_switch_sets: the combinations of languages commonly mixed in, most
#   common first. A set may hold more than one language (e.g. [en, hi] for a
#   Kannada speaker mixing English and Hindi) and may be limited to some
#   regional_variants (Hindi mixing applies to Indian varieties only).
#   Indian pattern: Hindi mixes English, or English + a regional language;
#   regional Indian languages mix English, or English + Hindi; Indian English
#   mixes Hindi, a regional language, or both. English has romanized_usage
#   none, so Hindi or regional words in English-led speech are romanized.
# regional_variants: BCP-47 variants to spread generation across; empty means
#   the language code itself.
# tier: A = human-verified by the project owner; B = native-speaker spot
#   checks; C = synthetic only, reported as unverified.
# rollout_phase: 1 = English and Hindi, 2 = Kannada and Tamil, 3 = the rest.
#
# romanized_usage, code_switch_sets and regional_variants for tier C
# languages are first estimates and should be corrected when evidence appears.

version: 0.2.0

