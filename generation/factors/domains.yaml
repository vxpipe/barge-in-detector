# Conversation categories (domains) and concrete scenarios within each.
# Scenario ids are unique across all domains.

version: 0.1.0

domains:
  - id: banking
    description: Retail banking and cards.
    scenarios:
      - {id: banking_balance_enquiry, description: Balance or recent transactions.}
      - {id: banking_card_block, description: Blocking a lost or stolen card.}
      - {id: banking_fraud_dispute, description: Disputing an unknown transaction.}
      - {id: banking_loan_emi, description: Loan EMI schedule or prepayment.}
      - {id: banking_kyc_update, description: Updating KYC or contact details.}

  - id: insurance
    description: Insurance policies and claims.
    scenarios:
      - {id: insurance_claim_status, description: Status of an existing claim.}
      - {id: insurance_policy_renewal, description: Renewing a policy.}
      - {id: insurance_new_quote, description: Getting a premium quote.}

  - id: telecom
    description: Mobile and broadband providers.
    scenarios:
      - {id: telecom_plan_change, description: Changing or upgrading a plan.}
      - {id: telecom_bill_dispute, description: Disputing a bill charge.}
      - {id: telecom_network_complaint, description: Poor coverage or no signal.}
      - {id: telecom_recharge, description: Prepaid recharge or top-up.}

  - id: utilities
    description: Electricity, water and gas.
    scenarios:
      - {id: utilities_outage_report, description: Reporting an outage.}
      - {id: utilities_bill_payment, description: Paying or querying a bill.}
      - {id: utilities_new_connection, description: Applying for a new connection.}

  - id: ecommerce
    description: Online shopping.
    scenarios:
      - {id: ecommerce_order_status, description: Where an order is.}
      - {id: ecommerce_return_refund, description: Returning an item or refund status.}
      - {id: ecommerce_exchange, description: Exchanging size or colour.}
      - {id: ecommerce_product_enquiry, description: Questions about a product.}

  - id: food_delivery
    description: Restaurant and grocery delivery.
    scenarios:
      - {id: food_order_tracking, description: Tracking a delivery.}
      - {id: food_missing_item, description: Missing or wrong item.}
      - {id: food_order_placement, description: Placing an order by phone.}

  - id: logistics
    description: Couriers and parcel delivery.
    scenarios:
      - {id: logistics_parcel_tracking, description: Tracking a parcel.}
      - {id: logistics_reschedule, description: Rescheduling a delivery.}
      - {id: logistics_address_change, description: Changing the delivery address.}

  - id: travel
    description: Airlines, trains and buses.
    scenarios:
      - {id: travel_new_booking, description: Booking a ticket.}
      - {id: travel_change_cancel, description: Changing or cancelling a booking.}
      - {id: travel_baggage, description: Lost or delayed baggage.}
      - {id: travel_delay_info, description: Delay or platform/gate information.}

  - id: hospitality
    description: Hotels and restaurants.
    scenarios:
      - {id: hospitality_hotel_booking, description: Booking or modifying a hotel stay.}
      - {id: hospitality_table_reservation, description: Reserving a restaurant table.}
      - {id: hospitality_guest_request, description: In-stay request or complaint.}

  - id: ride_hailing
    description: Taxis and ride-hailing.
    scenarios:
      - {id: ride_booking, description: Booking a ride.}
      - {id: ride_driver_issue, description: Complaint about a driver or trip.}
      - {id: ride_fare_dispute, description: Disputing a fare.}

  - id: healthcare
    description: Clinics and hospitals (administrative, not diagnosis).
    scenarios:
      - {id: healthcare_appointment, description: Booking or moving an appointment.}
      - {id: healthcare_prescription_refill, description: Prescription refill request.}
      - {id: healthcare_test_results, description: Whether test results are ready.}
      - {id: healthcare_billing, description: Hospital bill or insurance cover.}

  - id: government
    description: Public services.
    scenarios:
      - {id: government_application_status, description: Status of a document or certificate application.}
      - {id: government_tax_enquiry, description: Tax filing or refund question.}
      - {id: government_complaint, description: Civic complaint (roads, water, waste).}

  - id: education
    description: Schools, colleges and courses.
    scenarios:
      - {id: education_admissions, description: Admission process and deadlines.}
      - {id: education_fee_payment, description: Fee payment or instalments.}
      - {id: education_course_info, description: Course content and schedule.}

  - id: real_estate
    description: Property sales and rentals.
    scenarios:
      - {id: real_estate_property_enquiry, description: Details of a listing.}
      - {id: real_estate_site_visit, description: Scheduling a visit.}
      - {id: real_estate_rent_maintenance, description: Tenant rent or maintenance request.}

  - id: automotive
    description: Car sales, service and roadside help.
    scenarios:
      - {id: automotive_service_booking, description: Booking a service.}
      - {id: automotive_test_drive, description: Scheduling a test drive.}
      - {id: automotive_roadside_assistance, description: Breakdown assistance.}

  - id: tech_support
    description: Devices, internet and software.
    scenarios:
      - {id: tech_internet_troubleshooting, description: Internet not working.}
      - {id: tech_device_setup, description: Setting up a device or app.}
      - {id: tech_account_access, description: Password reset or locked account.}
      - {id: tech_software_issue, description: An app or software error.}

  - id: sales_outbound
    description: Outbound sales calls.
    scenarios:
      - {id: sales_product_pitch, description: Pitching a product.}
      - {id: sales_lead_qualification, description: Qualifying a lead.}
      - {id: sales_renewal_offer, description: Offering a renewal or upgrade.}

  - id: collections
    description: Payment reminders.
    scenarios:
      - {id: collections_payment_reminder, description: Reminding of an overdue payment.}
      - {id: collections_payment_plan, description: Arranging a payment plan.}

  - id: surveys
    description: Feedback and research calls.
    scenarios:
      - {id: surveys_csat, description: Satisfaction survey after a service.}
      - {id: surveys_market_research, description: Market research questionnaire.}

  - id: recruiting
    description: Hiring and HR.
    scenarios:
      - {id: recruiting_interview_scheduling, description: Scheduling an interview.}
      - {id: recruiting_candidate_screening, description: Screening questions.}

  - id: home_services
    description: Repairs and personal services.
    scenarios:
      - {id: home_repair_booking, description: Plumber, electrician or appliance repair.}
      - {id: home_salon_booking, description: Salon or spa appointment.}
      - {id: home_cleaning_booking, description: Cleaning or pest control.}

  - id: personal_assistant
    description: General-purpose voice assistant.
    scenarios:
      - {id: assistant_reminders, description: Setting reminders or alarms.}
      - {id: assistant_information, description: Answering a general question (weather, recipe, facts).}
      - {id: assistant_small_talk, description: Casual conversation.}
