# Rules that remove impossible or meaningless factor combinations.
#
# Rule forms:
#   when:    factor values (or language attributes) that trigger the rule
#   require: allowed values for other factors when the rule triggers
#   forbid:  disallowed values for other factors when the rule triggers
# A spec is valid only if no triggered rule is violated. Per-intent
# Membership rules (scenario within domain, regional_variant within language,
# code_switch_set within the language's sets for that regional_variant) are
# implied by values_from.

version: 0.7.0

rules:
  # ---- scripts and code-switching ----
  - id: no_romanized_without_usage
    description: Romanized or mixed script only where people write the language that way.
    when: {language.romanized_usage: [none]}
    require: {script_form: [native]}

  - id: no_code_switch_without_partner
    description: Code-switching needs a partner language.
    when: {language.code_switch_sets: [empty]}
    require: {code_switching: [none]}

  - id: code_switch_set_matches
    description: A code-switch set is chosen exactly when code-switching.
    when: {code_switching: [none]}
    require: {code_switch_set: [none]}

  # ---- speaker state and intents ----
  - id: answer_needs_finished_question
    description: Answering a question needs a finished question.
    when: {caller_intent: [answer_to_question]}
    require:
      agent_activity: [asking_yes_no_question, asking_open_question, confirming_details]
      cut_position: [just_finished]

  - id: early_answer_needs_choice_in_progress
    description: Answering early needs a question or choice still being spoken.
    when: {caller_intent: [early_answer]}
    require:
      agent_activity: [asking_yes_no_question, asking_open_question, listing_options, confirming_details]
      cut_position: [early, middle, near_end]

  - id: early_answer_to_closed_question_near_end
    description: >
      An early answer to a yes/no question or a read-back only once the
      question is clear, i.e. near its end.
    when:
      caller_intent: [early_answer]
      agent_activity: [asking_yes_no_question, confirming_details]
    require: {cut_position: [near_end]}

  - id: no_backchannel_after_finished_question
    description: >
      After a finished question, "yes"/"ok" is an answer, not a backchannel.
      Fillers there are thinking_filler_after_question (ambiguous).
    when:
      cut_position: [just_finished]
      agent_activity: [asking_yes_no_question, asking_open_question, confirming_details]
    forbid:
      caller_intent: [continuer, acknowledgment, agreement_token, reaction_token, gratitude_token, tracking_repeat, go_ahead]

  - id: no_affirmative_backchannel_near_end_of_closed_question
    description: >
      Near the end of a yes/no question or read-back, "yes"/"ok" reads as an
      early answer, so these backchannels are not generated there.
    when:
      cut_position: [near_end]
      agent_activity: [asking_yes_no_question, confirming_details]
    forbid:
      caller_intent: [continuer, acknowledgment, agreement_token, gratitude_token, go_ahead]

  - id: thinking_filler_needs_finished_question
    when: {caller_intent: [thinking_filler_after_question]}
    require:
      agent_activity: [asking_yes_no_question, asking_open_question]
      cut_position: [just_finished]

  - id: tracking_repeat_needs_readout
    description: Repeating to track needs the speaker to be reading something out.
    when: {caller_intent: [tracking_repeat]}
    require:
      agent_activity: [reading_numbers, reading_names_addresses, confirming_details, giving_instructions]
      cut_position: [early, middle, near_end]

  - id: correction_needs_content
    description: Something must have been said before it can be corrected.
    when: {caller_intent: [correction]}
    forbid:
      cut_position: [start]
      agent_activity: [greeting_opening, hold_message, small_talk]

  - id: collaborative_completion_needs_unfinished_turn
    when: {caller_intent: [collaborative_completion]}
    require: {cut_position: [middle, near_end]}

  - id: interruption_intents_while_speaking
    description: These only make sense while the speaker is still talking.
    when: {caller_intent: [floor_request, tracking_repeat, skip_request]}
    forbid: {cut_position: [just_finished]}

  - id: hello_check_after_agent_stops
    description: Checking whether anyone is there makes sense once the speaker has gone quiet.
    when: {caller_intent: [hello_check]}
    require: {cut_position: [just_finished]}

  - id: turn_continuation_needs_own_turn
    description: >
      Continuing one's own earlier point needs the judged speaker's earlier
      turn in the window (s1, s2, s1).
    when: {caller_intent: [turn_continuation]}
    require: {speaker_pattern: [returning_speaker]}

  # ---- development ----
  - id: development_only_for_barge_in
    description: Only barge-in utterances develop from a backchannel or filler.
    when:
      caller_intent: [continuer, acknowledgment, agreement_token, reaction_token, gratitude_token, tracking_repeat, go_ahead, collaborative_completion, thinking_filler_after_question]
    require: {development: [stable]}

  - id: no_backchannel_development_into_stop
    description: Stop and repeat requests rarely start with an agreement token.
    when: {caller_intent: [floor_request, repeat_request]}
    forbid: {development: [backchannel_then_barge_in]}

  # ---- mood plausibility ----
  - id: complaint_mood
    when: {caller_intent: [complaint]}
    require: {caller_mood: [frustrated, hurried]}
