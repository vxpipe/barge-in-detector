# English only, no other language mixed in: every valid combination, the same
# number of utterances each (user decision, 2026-11-15). The first dataset, to
# fine-tune and evaluate a model before the other languages and mixing.

name: english
seed: 20261115
languages: [en]
all_combinations: true
only: {code_switching: [none]}
criteria_per_language: 0  # unused with all_combinations
required_count: 5

label_shares: {backchannel: 0.5, barge_in: 0.5}  # unused with all_combinations

split_ratios: {train: 0.8, validation: 0.1, test: 0.1}
