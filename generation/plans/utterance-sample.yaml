# Utterance track sample for user review (docs/utterance-first-decision.md):
# five criteria per manifest language (14 languages), five utterances each. Growing it later
# (more criteria, higher counts) keeps these criteria and their splits.

name: utterance-sample
seed: 20261115
languages: [en, hi, kn, ta, te, ml, zh, ja, id, fil, fr, de, es, it]
criteria_per_language: 5
required_count: 5

label_shares: {backchannel: 0.5, barge_in: 0.5}

# English is US, Indian (plain and code-switched) and Singaporean English
# (user decision, 2026-11-15). Other languages use the builder's default
# variant shares.
variant_shares:
  en: {en-US: 0.4, en-IN: 0.4, en-SG: 0.2}

split_ratios: {train: 0.8, validation: 0.1, test: 0.1}
